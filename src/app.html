<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The macOS app icon everywhere: browser tabs, Google results (square
         icons, including sizes above 48px), home screens. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png" />
    <link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      try {
        if (localStorage.getItem('docuflex-theme') === 'dark' && !location.pathname.match(/^\/?$/)) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch {}
    </script>
    <script>
      // WebKitGTK (Linux desktop app) re-blurs everything behind a
      // backdrop-filter on every scroll frame, which makes the editor lag.
      if (/Linux/.test(navigator.userAgent) && !/Android|Chrome|Firefox/.test(navigator.userAgent)) {
        document.documentElement.classList.add('docuflex-webkitgtk');
      }
    </script>
    <style>
      html.docuflex-webkitgtk *,
      html.docuflex-webkitgtk *::before,
      html.docuflex-webkitgtk *::after {
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
      }
      /* Animating the toolbar's width and the tool menu's scale re-lays out
         and repaints it over the PDF canvas every frame in WebKitGTK. */
      html.docuflex-webkitgtk .editor-toolbar-wrap,
      html.docuflex-webkitgtk .editor-toolbar-wrap *,
      html.docuflex-webkitgtk .toolbar-tooltip {
        transition: none !important;
        animation: none !important;
      }
      html.docuflex-webkitgtk .editor-toolbar-wrap {
        will-change: transform;
      }
      html.docuflex-webkitgtk .tool-menu {
        background: #fff !important;
      }
      html.docuflex-webkitgtk[data-theme='dark'] .tool-menu {
        background: #181818 !important;
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
