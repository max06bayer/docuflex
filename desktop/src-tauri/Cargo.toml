[package]
name = "docuflex-desktop"
version = "0.9.3"
description = "Docuflex offline PDF editor for macOS, Windows, and Linux"
authors = ["Maximilian Bayer"]
edition = "2021"

[lib]
name = "docuflex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
side-by-side = []

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = "0.22.1"
libc = "0.2.186"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = ["devtools"] }
tauri-plugin-single-instance = "2.4.0"
url = "2.5.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSButton", "NSControl", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }
